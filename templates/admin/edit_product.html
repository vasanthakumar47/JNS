{% extends 'base.html' %}

{% block title %}Edit Spare Part - Admin{% endblock %}

{% block content %}
<div class="container" style="max-width: 650px; margin: 30px auto;">
    <div style="background: white; padding: 35px 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;">
        <h2 style="margin-bottom: 20px; color: var(--navy-dark); font-weight: 800;">
            <i class="bi bi-pencil-square text-warning"></i> Edit Spare Part #{{ product.id }}
        </h2>
        
        <form action="/admin/edit/{{ product.id }}" method="POST">
            
            <div style="margin-bottom: 20px; text-align: center; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1;">
                <p style="font-weight: 700; margin-bottom: 8px; font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Image Preview</p>
                <img src="{{ product.image_url }}" alt="{{ product.name }}" style="max-height: 160px; max-width: 100%; object-fit: contain; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Spare Part Name</label>
                <input type="text" name="name" value="{{ product.name }}" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Category</label>
                <input type="text" name="category" value="{{ product.category }}" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Price</label>
                <input type="text" name="price" value="{{ product.price }}" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;" required>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Badge Status</label>
                <select name="badge" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;">
                    <option value="In Stock" {% if product.badge == 'In Stock' %}selected{% endif %}>In Stock</option>
                    <option value="Best Seller" {% if product.badge == 'Best Seller' %}selected{% endif %}>Best Seller</option>
                    <option value="OEM Grade" {% if product.badge == 'OEM Grade' %}selected{% endif %}>OEM Grade</option>
                    <option value="High Precision" {% if product.badge == 'High Precision' %}selected{% endif %}>High Precision</option>
                    <option value="High Durability" {% if product.badge == 'High Durability' %}selected{% endif %}>High Durability</option>
                    <option value="Tungsten Carbide" {% if product.badge == 'Tungsten Carbide' %}selected{% endif %}>Tungsten Carbide</option>
                    <option value="OEM Certified" {% if product.badge == 'OEM Certified' %}selected{% endif %}>OEM Certified</option>
                    <option value="Custom Built" {% if product.badge == 'Custom Built' %}selected{% endif %}>Custom Built</option>
                </select>
            </div>

            <!-- Fixed: type="text" allows local paths like /static/Images/... without URL error -->
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Image Path / Link</label>
                <input type="text" name="image_url" value="{{ product.image_url }}" placeholder="/static/Images/filename.jpg" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; font-weight:700; margin-bottom:6px; color:#1e293b;">Description</label>
                <textarea name="description" rows="3" style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.95rem;" required>{{ product.description }}</textarea>
            </div>

            <button type="submit" class="btn-main" style="width: 100%; justify-content: center; font-size: 1rem;">
                <i class="bi bi-check-circle-fill"></i> Update Product Details
            </button>
            <a href="/admin" style="display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
